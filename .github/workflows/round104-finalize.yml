name: Round104 production evidence runtime regression

on:
  push:
    branches: ["round104-production-evidence-runtime"]
    paths:
      - "android-app/**"
      - ".gitignore"
      - "web-admin/admin.html"
      - "web-admin/admin-spa.js"
      - "web-admin/index.html"
      - "web-admin/ocr-simple.js"
      - "web-admin/content-page.js"
      - "web-admin/dashboard.html"
      - "web-admin/dashboard.js"
      - "web-admin/reports.html"
      - "web-admin/reports.js"
      - "web-admin/review.html"
      - "web-admin/review.js"
      - "web-admin/review-logic.js"
      - "web-admin/review-runtime-round104.js"
      - "web-admin/review-editor-round104.js"
      - "web-admin/review-storage-sync-round104.js"
      - "web-admin/review-evidence-direct-round104.js"
      - "web-admin/review-round104.css"
      - "web-admin/review-editor-round104.css"
      - "web-admin/review-evidence-direct-round104.css"
      - "web-admin/review-workspace-v2.css"
      - "web-admin/review-workspace-v2.js"
      - "web-admin/ocr-terminal-pos-round10417.js"
      - "web-admin/storage.html"
      - "web-admin/storage.js"
      - "web-admin/storage-evidence-diagnostics-round104.js"
      - "tests/review-logic.test.js"
      - "tests/round10417-pos-terminal.test.js"
      - "tools/round104_worker_runtime_patch.py"
      - "tools/round104_review_editor_patch.py"
      - "tools/round104_review_editor_preserve_pos_patch.py"
      - "tools/round104_evidence_finalize_patch.py"
      - "tools/round104_2_worker_storage_patch.py"
      - "tools/round104_4_orphan_diagnostics_patch.py"
      - "tools/round104_6_office_performance_patch.py"
      - "cloudflare/migrations/round103_submission_evidence.sql"
      - "cloudflare/migrations/round104_6_office_performance.sql"
      - ".github/workflows/round104-finalize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Round104
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Round103 baseline
        run: git merge-base --is-ancestor ba4bbfeb1f20bf1c80583967bc73cfc51b79f089 HEAD

      - name: Verify Round104.17 Android version and direct evidence upload
        run: |
          grep -q 'versionCode = 109' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.104.17"' android-app/app/build.gradle.kts
          grep -q 'X-Evidence-Kind' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'X-Evidence-Slot' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'setFixedLengthStreamingMode' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'Server ยังไม่ยืนยันการบันทึก' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt

      - name: Protect Round103 OCR baseline and allow Round104.17 terminal POS files
        run: |
          unexpected="$(git diff --name-only ba4bbfeb1f20bf1c80583967bc73cfc51b79f089 -- android-app/app/src/main/java/com/receiptocr/app/ocr | grep -Ev '(^|/)(PosIdentityResolver|RealOcrPipeline)\.kt$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected OCR changes:"
            echo "$unexpected"
            exit 1
          fi
          grep -q 'useLastWorkPos' android-app/app/src/main/java/com/receiptocr/app/ocr/PosIdentityResolver.kt
          grep -q 'runtimeLastWorkPos = expectedPosSet.maxOrNull() ?: 0' android-app/app/src/main/java/com/receiptocr/app/ocr/RealOcrPipeline.kt
          grep -q 'syncEvidenceForLatestSubmission' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'finalizeSubmission' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'api/app/submissions/.*/finalize' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'EVIDENCE_PENDING_STATUS' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt

      - name: Office speed and Admin UI checks
        run: |
          node tests/review-logic.test.js
          node tests/round10417-pos-terminal.test.js
          node --check web-admin/admin-spa.js
          node --check web-admin/ocr-simple.js
          node --check web-admin/ocr-terminal-pos-round10417.js
          node --check web-admin/content-page.js
          node --check web-admin/dashboard.js
          node --check web-admin/reports.js
          node --check web-admin/review.js
          node --check web-admin/review-logic.js
          node --check web-admin/review-runtime-round104.js
          node --check web-admin/review-editor-round104.js
          node --check web-admin/review-storage-sync-round104.js
          node --check web-admin/review-evidence-direct-round104.js
          node --check web-admin/review-workspace-v2.js
          node --check web-admin/storage.js
          node --check web-admin/storage-evidence-diagnostics-round104.js
          grep -q 'VERSION="104173"' web-admin/admin-spa.js
          grep -q 'admin-spa.js?v=104173' web-admin/admin.html
          grep -q 'ocr-simple.js?v=104173' web-admin/index.html
          grep -q 'useLastWorkPos:true' web-admin/ocr-simple.js
          grep -q 'Math.max(...values)' web-admin/ocr-simple.js
          ! grep -q 'round10417TerminalPos' web-admin/admin-spa.js
          grep -q 'review-workspace-v2.css?v=104161' web-admin/review.html
          grep -q 'review-workspace-v2.js?v=104161' web-admin/review.html
          grep -q 'data-review-round="104161"' web-admin/review.html
          ! grep -q 'review-modern.css' web-admin/review.html
          ! grep -q 'review-round103.css' web-admin/review.html
          ! grep -q 'review-round103-fix.css' web-admin/review.html
          ! grep -q 'review-round104.css' web-admin/review.html
          grep -q 'rv216-many-pos' web-admin/review-workspace-v2.js
          grep -q 'rv216EvidenceToggle' web-admin/review-workspace-v2.js
          grep -q 'reviewDateFrom' web-admin/review-workspace-v2.js
          grep -q 'detailEnhanceQueued' web-admin/review-workspace-v2.js
          grep -q "btn.textContent!==next" web-admin/review-workspace-v2.js
          grep -q "editor.textContent!=='ข้อมูลร้านและงานตรวจ'" web-admin/review-workspace-v2.js
          grep -q 'max-width:calc(100% - 20px)' web-admin/review-workspace-v2.css
          grep -q 'reviewEvidenceManager:not(.rv216-expanded)' web-admin/review-workspace-v2.css
          ! grep -q 'review-queue-integrated-round10413.js' web-admin/review.html
          ! grep -q 'review-livequeue-round10414.js' web-admin/review.html
          grep -q 'summary=1' web-admin/admin-spa.js
          grep -q '/api/admin/office-summary' web-admin/dashboard.js
          grep -q 'dateFrom=' web-admin/reports.js
          grep -q 'parentSessionReady' web-admin/content-page.js
          grep -q 'Promise.all(unique.map' web-admin/review.js
          grep -q 'ข้อมูลร้านและ POS ใช้งานได้แล้ว' web-admin/review.js
          grep -q 'warmImages' web-admin/review-evidence-direct-round104.js
          ! grep -q 'AdminAuth.json=async function' web-admin/review-storage-sync-round104.js
          grep -q 'review-storage-sync-round104.js' web-admin/review.html
          grep -q 'review-evidence-direct-round104.js' web-admin/review.html
          grep -q 'evidence-repair' web-admin/review-storage-sync-round104.js
          grep -q 'สถานะข้อมูลและไฟล์ภาพ' web-admin/storage.html
          grep -q 'ตรวจสอบภาพที่ยังไม่เชื่อมกับงาน' web-admin/storage.html
          grep -q 'storage-evidence-diagnostics-round104.js' web-admin/storage.html
          grep -q 'diagOrphanRows' web-admin/storage.html
          grep -q '/api/storage/evidence-health' web-admin/storage.js
          grep -q '/api/storage/evidence-reconcile' web-admin/storage.js
          grep -q '/api/storage/cleanup-execute' web-admin/storage.js
          grep -q '/api/storage/evidence-diagnostics' web-admin/storage-evidence-diagnostics-round104.js
          grep -q '/api/storage/evidence-orphan-link' web-admin/storage-evidence-diagnostics-round104.js
          grep -q 'แก้ไขข้อมูลร้าน / POS' web-admin/review-editor-round104.js
          grep -q 'data-add-evidence' web-admin/review-editor-round104.js
          grep -q 'data-delete-evidence' web-admin/review-editor-round104.js

      - name: Verify Worker coordinator patches and D1 performance indexes
        run: |
          python -m py_compile tools/round104_worker_runtime_patch.py
          python -m py_compile tools/round104_review_editor_patch.py
          python -m py_compile tools/round104_review_editor_preserve_pos_patch.py
          python -m py_compile tools/round104_evidence_finalize_patch.py
          python -m py_compile tools/round104_2_worker_storage_patch.py
          python -m py_compile tools/round104_4_orphan_diagnostics_patch.py
          python -m py_compile tools/round104_6_office_performance_patch.py
          grep -q 'officePerformance: true' tools/round104_6_office_performance_patch.py
          grep -q '/api/admin/office-summary' tools/round104_6_office_performance_patch.py
          grep -q 'fastCheck:true' tools/round104_6_office_performance_patch.py
          grep -q 'summary=String' tools/round104_6_office_performance_patch.py
          grep -q 'private, max-age=300' tools/round104_6_office_performance_patch.py
          grep -q 'idx_admin_sessions_token_hash_expires' cloudflare/migrations/round104_6_office_performance.sql
          grep -q 'idx_field_submissions_status_updated' cloudflare/migrations/round104_6_office_performance.sql
          grep -q 'idx_r2_objects_category_deleted_updated' cloudflare/migrations/round104_6_office_performance.sql
          grep -q 'field_submission_evidence' cloudflare/migrations/round103_submission_evidence.sql

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Round104.17 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptOCR-Round104-17-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
