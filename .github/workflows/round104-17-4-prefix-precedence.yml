name: Round104.17.4 mapped POS prefix precedence

on:
  push:
    branches: ["round104-production-evidence-runtime"]
    paths:
      - ".github/workflows/round104-17-4-prefix-precedence.yml"
      - "tools/round104_17_4_prefix_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: round104-production-evidence-runtime
          fetch-depth: 0

      - name: Apply mapped-prefix repair
        run: python tools/round104_17_4_prefix_patch.py

      - name: Verify Admin behavior
        run: |
          node --check web-admin/ocr-simple.js
          node --check web-admin/admin-spa.js
          node tests/round10417-pos-terminal.test.js
          grep -q 'ocr-simple.js?v=104174' web-admin/index.html
          grep -q 'VERSION="104174"' web-admin/admin-spa.js
          grep -q 'admin-spa.js?v=104174' web-admin/admin.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Android unit tests
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Commit Round104.17.4 core repair
        run: |
          git config user.name "receiptocr-actions"
          git config user.email "actions@users.noreply.github.com"
          git add web-admin/ocr-simple.js web-admin/admin-spa.js web-admin/admin.html web-admin/index.html tests/round10417-pos-terminal.test.js android-app/app/src/main/java/com/receiptocr/app/ocr/PosIdentityResolver.kt android-app/app/src/test/java/com/receiptocr/app/ocr/PosIdentityResolverRound10417Test.kt
          git diff --cached --quiet && exit 0
          git commit -m "Round104.17.4 make explicit POS mappings override stale prefixes"
          git push origin HEAD:round104-production-evidence-runtime
