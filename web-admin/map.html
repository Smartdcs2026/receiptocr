<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ศูนย์แผนที่ร้าน</title>
  <link rel="stylesheet" href="styles.css?v=64">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
</head>
<body>
<div class="officePage professionalMapPage">
  <section class="mapCommandBar">
    <div class="mapPrimaryFilters">
      <label>ผู้ปฏิบัติงาน<select id="mapUser"></select></label>
      <label>ตั้งแต่วันที่<input id="mapFrom" type="date"></label>
      <label>ถึงวันที่<input id="mapTo" type="date"></label>
      <button id="loadMap" class="primary">ประมวลผลแผนที่</button>
    </div>
    <div class="mapCommandActions">
      <button id="exportMap" class="secondary" title="ดาวน์โหลดรายชื่อร้านที่กำลังแสดง">ดาวน์โหลดรายชื่อ</button>
      <button id="toggleMapPanel" class="ghost" title="ซ่อนหรือแสดงแผงรายการร้าน">ซ่อนรายการ</button>
    </div>
  </section>

  <section id="mapFullscreenArea" class="mapFullscreenArea">
    <section class="mapOperationsBar" aria-label="เครื่องมือแผนที่">
      <div class="mapOperationsTitle"><strong>เครื่องมือแผนที่</strong><span id="mapModeStatus" class="mapModeStatus">พร้อมใช้งาน</span></div>
      <div class="mapToolDock" role="toolbar">
        <button id="fitMap" title="แสดงร้านทั้งหมด"><span>⌗</span>ร้านทั้งหมด</button>
        <button id="routePlannerMap" title="วางเส้นทางระหว่างร้าน" disabled><span>⌁</span>วางเส้นทาง</button>
        <button id="nearbyMap" title="ค้นหาร้านใกล้ร้านที่เลือก" disabled><span>◎</span>ร้านใกล้เคียง</button>
        <button id="measureMap" title="วัดระยะทางแบบเส้นตรง"><span>↔</span>วัดระยะ</button>
        <button id="undoMeasure" class="measureContextBtn" title="ย้อนกลับจุดวัดล่าสุด" disabled hidden><span>↶</span>ย้อนกลับ</button>
        <button id="clearMeasure" class="measureContextBtn" title="ล้างเส้นวัด" disabled hidden><span>×</span>ล้างระยะ</button>
        <button id="fullscreenMap" title="เปิดแผนที่และเครื่องมือเต็มจอ"><span>⛶</span>เต็มจอ</button>
      </div>
    </section>

    <section id="routePlannerPanel" class="routePlannerPanel" hidden>
      <header><div><strong>วางเส้นทางระหว่างร้าน</strong><span>ค้นหาด้วยรหัสร้าน ชื่อร้าน หรือแบรนด์</span></div><div class="routePanelActions"><button id="clearRoute" class="ghost">ล้าง</button><button id="closeRoutePlanner" class="ghost" aria-label="ปิด">×</button></div></header>
      <div class="routePlannerControls">
        <label>ร้านต้นทาง<div class="routeSearchField"><span>⌕</span><input id="routeFrom" list="routeStoreOptions" autocomplete="off" placeholder="พิมพ์รหัสหรือชื่อร้าน"></div></label>
        <button id="swapRoute" class="routeSwap" title="สลับต้นทางและปลายทาง">⇄</button>
        <label>ร้านปลายทาง<div class="routeSearchField"><span>⌕</span><input id="routeTo" list="routeStoreOptions" autocomplete="off" placeholder="พิมพ์รหัสหรือชื่อร้าน"></div></label>
        <label>วิธีเดินทาง<select id="routeTravel"><option value="driving">รถยนต์</option><option value="motorcycle">รถจักรยานยนต์</option><option value="walking">เดิน</option><option value="bicycling">จักรยาน</option><option value="transit">ขนส่งสาธารณะ</option></select></label>
        <button id="calculateRoute" class="primary">คำนวณ</button>
      </div>
      <datalist id="routeStoreOptions"></datalist>
      <div id="routeOutput" class="routeOutput" hidden></div>
    </section>

    <section class="mapKpiBar" aria-label="สรุปข้อมูลบนแผนที่">
      <article><span>ร้านที่มีพิกัด</span><strong id="mapTotalKpi">0</strong></article>
      <article><span>กำลังแสดง</span><strong id="mapVisibleKpi">0</strong></article>
      <article><span>จำนวนแบรนด์</span><strong id="mapBrandKpi">0</strong></article>
      <article><span>จำนวน POS</span><strong id="mapPosKpi">0</strong></article>
      <article class="mapKpiWarning"><span>ร้านไม่มีพิกัด</span><strong id="mapMissingKpi">0</strong></article>
    </section>

    <section id="mapWorkspace" class="professionalMapWorkspace">
    <div class="mapCanvasWrap">
      <div id="storeMap" class="professionalStoreMap"></div>
      <div id="measureResult" class="professionalMeasureResult" hidden></div>
    </div>

    <aside class="professionalMapSide">
      <header class="mapSideHeader">
        <div><strong>ร้านในแผนงาน</strong><span id="mapSummary">0 ร้าน</span></div>
        <span class="mapLiveBadge"><i></i>ข้อมูลแผนงาน</span>
      </header>

      <div class="mapSideFilters">
        <label class="mapSearchBox"><span>⌕</span><input id="mapSearch" type="search" placeholder="ค้นหารหัสหรือชื่อร้าน"></label>
        <select id="mapBrand" aria-label="กรองตามแบรนด์"><option value="">ทุกแบรนด์</option></select>
      </div>

      <div id="mapBrandLegend" class="mapBrandLegend"></div>

      <div id="selectedStorePanel" class="selectedStorePanel" hidden></div>

      <div class="mapDataNotice">ใช้พิกัดประจำร้านจากแผนงานเท่านั้น ระบบนี้ไม่เก็บพิกัดของพนักงานขณะส่งงาน</div>
      <div id="mapStoreList" class="professionalMapStoreList"></div>
    </aside>
    </section>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="config.js"></script>
<script src="admin-auth.js?v=64"></script>
<script src="content-page.js"></script>
<script src="map.js?v=64"></script>
</body>
</html>
