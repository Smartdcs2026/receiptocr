name: Round97 finalize production

on:
  push:
    branches:
      - round97-import-diagnostics-temp-store-gps
    paths:
      - 'tools/round97_apply.py'
      - '.github/workflows/round97-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Round97
        uses: actions/checkout@v4
        with:
          ref: round97-import-diagnostics-temp-store-gps
          fetch-depth: 0

      - name: Verify Round96 production baseline
        run: |
          git merge-base --is-ancestor 309c9f0ff8e6cea418de7553037c2e9399344ae0 HEAD
          echo "Round96 production baseline is preserved"

      - name: Prepare duplicate cache path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android-app/app/src/main/java/com/receiptocr/app/data/remote/WorkPlanRepository.kt')
          text=p.read_text(encoding='utf-8')
          old='                LoadedWorkPlan(parseItems(cached), WorkPlanSource.CACHE)'
          new='                LoadedWorkPlan(applySavedLocations(context, parseItems(cached)), WorkPlanSource.CACHE)'
          if text.count(old)!=2:
              raise SystemExit(f'expected 2 cache paths, got {text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Apply Round97 production source
        run: python tools/round97_apply.py

      - name: Preserve normal store-code compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          models=Path('android-app/app/src/main/java/com/receiptocr/app/model/Models.kt')
          text=models.read_text(encoding='utf-8')
          old='''    val receiptStoreId: String = "",\n    val reviewStatus: String = "",'''
          new='''    val receiptStoreId: String = "",\n    val receiptStoreIdPending: Boolean = false,\n    val reviewStatus: String = "",'''
          if old not in text:
              raise SystemExit('Models.kt receiptStoreId field marker not found')
          text=text.replace(old,new,1)
          old='''    val expectedReceiptStoreId: String\n        get() = receiptStoreId.trim()'''
          new='''    val expectedReceiptStoreId: String\n        get() {\n            val explicit = receiptStoreId.trim()\n            if (explicit.isNotBlank()) return explicit\n            val raw = storeCode.trim()\n            val temporary = Regex("(?:^|[-_ ])(?:TEMP|TMP|NEW|PENDING)(?:[-_ ]|$)", RegexOption.IGNORE_CASE).containsMatchIn(raw) || raw.contains("ชั่วคราว")\n            return if (receiptStoreIdPending || temporary) "" else raw.filter(Char::isDigit)\n        }'''
          if old not in text:
              raise SystemExit('Models.kt expectedReceiptStoreId marker not found')
          models.write_text(text,encoding='utf-8')

          repo=Path('android-app/app/src/main/java/com/receiptocr/app/data/remote/WorkPlanRepository.kt')
          text=repo.read_text(encoding='utf-8')
          old='''                        receiptStoreId = o.receiptStoreId(),\n                        reviewStatus = o.cleanString("reviewStatus"),'''
          new='''                        receiptStoreId = o.receiptStoreId(),\n                        receiptStoreIdPending = o.optBoolean("receiptStoreIdPending", o.optBoolean("receipt_store_id_pending", false)),\n                        reviewStatus = o.cleanString("reviewStatus"),'''
          if old not in text:
              raise SystemExit('WorkPlanRepository.kt receiptStoreId parse marker not found')
          repo.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Admin import behavior
        run: |
          node --check web-admin/workplans-smart.js
          node --check web-admin/workplan-store-normalizer.js
          node tests/workplan-store-normalizer.test.js
          node tests/ocr-pattern-engine.test.js
          node tests/round94-admin-pos-mapping.test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Round97 requirements
        run: |
          grep -q 'versionCode = 99' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.97.0"' android-app/app/build.gradle.kts
          grep -Fq 'ACCESS_FINE_LOCATION' android-app/app/src/main/AndroidManifest.xml
          grep -Fq 'บันทึกพิกัด' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -Fq 'เปลี่ยนพิกัดร้าน?' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -Fq 'receiptStoreIdPending:true' web-admin/workplan-store-normalizer.js
          grep -Fq 'ยังนำเข้าไม่ได้' web-admin/workplans-smart.js
          grep -Fq 'ดูรายการ' web-admin/workplans-smart.js
          grep -Fq 'รหัสร้านบนบิล' web-admin/workplans-smart.js
          grep -Fq 'receiptStoreIdPending: Boolean = false' android-app/app/src/main/java/com/receiptocr/app/model/Models.kt
          grep -Fq 'receiptStoreIdPending || temporary' android-app/app/src/main/java/com/receiptocr/app/model/Models.kt
          grep -Fq 'StoreLocationRepository.applySaved' android-app/app/src/main/java/com/receiptocr/app/data/remote/WorkPlanRepository.kt

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit verified production source
        run: |
          git config user.name "SKDC_SMART"
          git config user.email "somchaibutphon@gmail.com"
          git add android-app web-admin tests
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Round97 import diagnostics temporary store and GPS"
            git push origin HEAD:round97-import-diagnostics-temp-store-gps
          fi
