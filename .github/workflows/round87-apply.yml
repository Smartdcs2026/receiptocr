name: Round87 Apply Independent POS Resolution

on:
  push:
    branches:
      - round87-independent-pos-resolution
    paths:
      - 'tools/round87_apply.py'
      - '.github/workflows/round87-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: round87-independent-pos-resolution
          fetch-depth: 0

      - name: Apply Round87 integration
        run: python tools/round87_apply.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app
          git diff --cached --quiet && exit 0
          git commit -m "Round87 independent POS resolution"
          git push origin HEAD:round87-independent-pos-resolution
