name: Round104.28 web-only fast review production

on:
  push:
    branches: ["round10428-review-fast-production"]
    paths:
      - "web-admin/review.html"
      - "web-admin/review-fast-round10428.css"
      - "web-admin/review-fast-round10428.js"
      - ".github/workflows/round104-28-review-fast-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-only branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify web-only scope and APK production baseline
        run: |
          unexpected="$(git diff --name-only 73f7cb1d40361af036c699af78f9e17848980af3...HEAD | grep -Ev '^(web-admin/review\.html|web-admin/review-fast-round10428\.css|web-admin/review-fast-round10428\.js|\.github/workflows/round104-28-review-fast-production\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-web changes:"
            echo "$unexpected"
            exit 1
          fi
          grep -q 'versionCode = 118' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.104.26"' android-app/app/build.gradle.kts

      - name: Verify fast review hooks
        run: |
          grep -q 'review-fast-round10428.css?v=104280' web-admin/review.html
          grep -q 'review-fast-round10428.js?v=104280' web-admin/review.html
          grep -q 'data-review-round="104280"' web-admin/review.html
          grep -q 'reviewFast10428' web-admin/review-fast-round10428.js
          grep -q 'rv28FilterToggle' web-admin/review-fast-round10428.js
          grep -q 'rv28ImageTools' web-admin/review-fast-round10428.js
          grep -q 'reviewAlert.good{display:none' web-admin/review-fast-round10428.css
          grep -q 'position:sticky' web-admin/review-fast-round10428.css

      - name: JavaScript syntax and review regression
        run: |
          node --check web-admin/review-fast-round10428.js
          node --check web-admin/review-workspace-v2.js
          node --check web-admin/review.js
          node tests/review-logic.test.js
