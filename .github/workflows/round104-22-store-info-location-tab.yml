name: Round104.22 store info and location tab

on:
  push:
    branches: ["round10422-store-info-location-tab"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Round104.22 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate patch syntax
        run: python -m py_compile tools/round104_22_store_info_location_tab_patch.py

      - name: Apply Round104.22 patch
        run: python tools/round104_22_store_info_location_tab_patch.py

      - name: Verify store info/location UX
        run: |
          grep -q 'versionCode = 114' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.104.22"' android-app/app/build.gradle.kts
          grep -q 'STORE_INFO("ข้อมูลร้าน")' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'private fun StoreInfoWorkTab' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'Text(if (locationBusy) "กำลังหา..." else "บันทึกพิกัด")' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'Text("เปิดแผนที่")' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'WorkTab.STORE_INFO -> Icons.Outlined.Storefront' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'StoreInfoWorkTab(' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Round104.22 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptOCR-Round104-22-debug-premerge
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Commit tested Round104.22 source
        run: |
          git config user.name "receiptocr-actions"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tools/round104_22_store_info_location_tab_patch.py \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          if git diff --cached --quiet; then
            echo "Round104.22 source already committed"
            exit 0
          fi
          git commit -m "Round104.22 restore store info and location tab"
          git push origin HEAD:round10422-store-info-location-tab
