name: Round89 Apply Admin Date Conventions

on:
  push:
    branches:
      - round89-admin-date-conventions

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: round89-admin-date-conventions
          fetch-depth: 0

      - name: Apply Round89 integration
        run: |
          python tools/round89_apply.py
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/receiptocr/app/ocr/RealOcrPipeline.kt')
          s = p.read_text(encoding='utf-8')
          old = 'import com.receiptocr.app.config.UniversalOcrTemplate\n'
          new = old + 'import com.receiptocr.app.config.OcrTemplateField\n'
          if 'import com.receiptocr.app.config.OcrTemplateField\n' not in s:
              if old not in s:
                  raise SystemExit('UniversalOcrTemplate import not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Admin OCR tests
        run: |
          node tests/ocr-pattern-engine.test.js
          node -c web-admin/ocr-simple.js
          node -c web-admin/ocr-template-contract.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app web-admin tests
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'Round89 admin date conventions and canonical date time'
            git push origin HEAD:round89-admin-date-conventions
          fi
