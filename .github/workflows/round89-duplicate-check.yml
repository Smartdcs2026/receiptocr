name: Round89 Duplicate POS Integration

on:
  push:
    branches:
      - round89-admin-date-conventions

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round89-admin-date-conventions
          fetch-depth: 0

      - name: Apply duplicate POS integration
        run: python tools/round89_duplicate_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Admin syntax and OCR tests
        run: |
          node tests/ocr-pattern-engine.test.js
          node -c web-admin/ocr-simple.js
          node -c web-admin/ocr-template-contract.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Android unit tests
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app
          if git diff --cached --quiet; then
            echo 'No source changes'
          else
            git commit -m 'Round89 surface and block duplicate POS evidence'
            git push origin HEAD:round89-admin-date-conventions
          fi
