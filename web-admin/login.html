<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบ | ReceiptOCR</title>
  <link rel="stylesheet" href="styles.css?v=60">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="loginPage">
  <main class="loginShell">
    <section class="loginWelcome" aria-label="ReceiptOCR">
      <div class="loginBrand"><div class="loginLogo">RO</div><strong>ReceiptOCR</strong></div>
      <div class="loginWelcomeText">
        <span>ระบบจัดการงานภาคสนาม</span>
        <h1>จัดการงานได้ครบ<br>ในหน้าจอเดียว</h1>
        <p>ตรวจงาน วางแผน และสรุปผลอย่างเป็นระบบ</p>
      </div>
      <small>สำหรับผู้ดูแลระบบและหัวหน้างาน</small>
    </section>
    <section class="loginCard">
      <div class="loginFormHead">
        <span>ยินดีต้อนรับ</span>
        <h2>เข้าสู่ระบบ</h2>
        <p id="loginSub">กรอกชื่อผู้ใช้และรหัสผ่านเพื่อดำเนินการต่อ</p>
      </div>
      <div id="setupFields" style="display:none">
        <label>ชื่อผู้ดูแลระบบ<input id="fullName" placeholder="กรอกชื่อ-นามสกุล"></label>
      </div>
      <label>ชื่อผู้ใช้<input id="username" autocomplete="username" placeholder="กรอกชื่อผู้ใช้"></label>
      <label>รหัสผ่าน
        <span class="loginPasswordField"><input id="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน"><button id="togglePassword" type="button" aria-label="แสดงรหัสผ่าน">แสดง</button></span>
      </label>
      <button id="loginBtn" class="primary full">เข้าสู่ระบบ</button>
      <button id="recoverBtn" class="loginRecover" type="button">ลืมรหัสผ่าน</button>
      <div id="loginHint" class="loginHint"></div>
      <p class="loginHelp">หากเข้าใช้งานไม่ได้ กรุณาติดต่อผู้ดูแลระบบ</p>
    </section>
  </main>
</div>
<script src="config.js"></script>
<script src="admin-auth.js?v=60"></script>
<script src="login.js?v=60"></script>
</body>
</html>
