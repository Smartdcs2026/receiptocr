<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์ตรวจสอบงาน</title><link rel="stylesheet" href="styles.css?v=65"><link rel="stylesheet" href="review-modern.css?v=99"><link rel="stylesheet" href="review-round103.css?v=1032"><link rel="stylesheet" href="review-round103-fix.css?v=1033"><link rel="stylesheet" href="review-round104.css?v=10462"><link rel="stylesheet" href="review-editor-round104.css?v=10462"><link rel="stylesheet" href="review-evidence-direct-round104.css?v=10462"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body>
<div class="reviewPage reviewV99 reviewV103 officePage">
  <section class="pageCommandBar reviewCommandBar">
    <div class="commandFilters reviewFilters">
      <label>สถานะ<select id="reviewStatus"><option value="SUBMITTED">รอตรวจ</option><option value="RETURNED">ส่งกลับแก้ไข</option><option value="APPROVED">ผ่านการตรวจ</option><option value="">ทั้งหมด</option></select></label>
      <label>พนักงาน<select id="reviewEmployee"><option value="">พนักงานทุกคน</option></select></label>
      <label>เรียงคิว<select id="reviewSort"><option value="oldest">ส่งก่อน ตรวจ ก่อน</option><option value="newest">งานล่าสุดก่อน</option></select></label>
      <label class="reviewSearchLabel">ค้นหา<input id="reviewSearch" type="search" placeholder="รหัสร้าน ชื่อร้าน หรือพนักงาน"></label>
      <button id="refreshReview" class="secondary">รีเฟรช</button>
      <button id="reviewNotify" class="secondary reviewNotifyButton" aria-pressed="false">แจ้งเตือน: ปิด</button>
    </div>
    <div class="reviewLiveMeta"><span class="reviewLiveDot"></span><span>อัปเดตอัตโนมัติทุก 15 วินาที</span><span id="reviewLastUpdated">-</span></div>
  </section>

  <section class="reviewMetrics" aria-label="สรุปคิวตรวจ">
    <div class="reviewMetric"><span>รอตรวจทั้งหมด</span><strong id="reviewPendingCount">0</strong></div>
    <div class="reviewMetric"><span>พนักงานที่มีงานรอ</span><strong id="reviewPendingPeople">0</strong></div>
    <div class="reviewMetric reviewMetricNew"><span>งานใหม่พร้อมตรวจ</span><strong id="reviewNewCount">0</strong></div>
    <div class="reviewMetric"><span>รอนานที่สุด</span><strong id="reviewOldestWait">-</strong></div>
  </section>

  <div id="reviewPeople" class="reviewPeople" aria-label="เลือกตรวจรายบุคคล"></div>

  <div class="reviewWorkspace">
    <aside class="reviewQueuePanel">
      <header><div><strong>คิวตรวจงาน</strong><span id="reviewQueueCaption">ส่งก่อนอยู่บนสุด เลือกคนเดียวได้จากแถบด้านบน</span></div><div class="reviewCountBox"><strong id="reviewCount">0</strong><span>รายการ</span></div></header>
      <div id="reviewQueue" class="reviewQueue"><div class="officeEmpty">กำลังโหลดข้อมูล</div></div>
    </aside>
    <main class="reviewDetailPanel" id="reviewDetail">
      <div class="reviewWelcome"><div class="reviewWelcomeIcon">✓</div><strong>เลือกงานจากคิวด้านซ้าย</strong><span>ระบบจะเปิดงานถัดไปให้อัตโนมัติหลังตรวจเสร็จ เพื่อให้ตรวจต่อเนื่องได้เร็วขึ้น</span></div>
    </main>
  </div>
</div>
<script src="config.js"></script><script src="admin-auth.js?v=10462"></script><script src="content-page.js?v=10462"></script><script src="review-logic.js?v=10462"></script><script src="review-evidence-round103.js?v=10462"></script><script src="review-runtime-round104.js?v=10462"></script><script src="review-editor-round104.js?v=10462"></script><script src="review-storage-sync-round104.js?v=10462"></script><script src="review-evidence-direct-round104.js?v=10462"></script><script src="review.js?v=10462"></script></body></html>
