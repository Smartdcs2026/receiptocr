<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReceiptOCR Admin - ผู้ใช้งาน</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="simplePage">
  <section class="simpleHero">
    <div>
      <h2>ผู้ใช้งาน</h2>
      <p>สร้างบัญชีพนักงาน และดูสถานะแผนงานของแต่ละคน</p>
    </div>
    <button id="addUserBtn" class="primary">เพิ่มผู้ใช้งาน</button>
  </section>

  <section class="simplePanel">
    <div class="simpleToolbar">
      <input id="userSearch" placeholder="ค้นหารหัส ชื่อ หรือชื่อเข้าระบบ">
      <div id="userCount" class="small">0 คน</div>
    </div>
    <div id="userList" class="userCardList"></div>
  </section>
</div>

<script src="config.js"></script>
<script src="admin-auth.js"></script>
<script src="content-page.js"></script>
<script src="users.js"></script>
</body>
</html>
