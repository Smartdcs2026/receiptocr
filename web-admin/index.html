<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReceiptOCR Admin - รูปแบบบิล</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="simplePage">
  <section class="simpleHero">
    <div>
      <h2>รูปแบบบิล</h2>
      <p>เลือกแบรนด์ แล้วกำหนดว่าข้อมูลบนบิลเรียงอย่างไร</p>
    </div>
  </section>

  <section class="simplePanel">
    <div class="simpleBrandSelect">
      <label>แบรนด์
        <select id="brandId"></select>
      </label>
      <button id="addPatternBtn" class="primary">เพิ่มรูปแบบบิล</button>
    </div>

    <div id="patternList" class="patternListSimple"></div>
  </section>

  <section id="editorPanel" class="simplePanel hidden">
    <div class="editorSimpleHead">
      <div>
        <h3 id="editorTitle">รูปแบบบิล</h3>
        <div class="small">จัดกล่องให้เหมือนข้อความจริงที่ผู้ใช้งานจะถ่าย</div>
      </div>
      <div class="editorHeadActions">
        <button id="deletePatternBtn" class="ghost dangerBtn">ลบรูปแบบนี้</button>
        <button id="savePatternBtn" class="primary">บันทึก</button>
      </div>
    </div>

    <div class="simpleFormGrid">
      <label>ชื่อรูปแบบ
        <input id="patternName" placeholder="เช่น ข้อมูลอยู่แถวเดียว">
      </label>
      <label>ตัวอย่างข้อความจริง
        <textarea id="sampleText" rows="3" placeholder="เช่น 22/08/2026 21:54 1705 002 17053001 6766"></textarea>
      </label>
    </div>

    <div class="rowChoice">
      <span>ข้อมูลอยู่กี่แถว</span>
      <div class="segmented">
        <button type="button" data-rows="1" class="rowCountBtn active">1 แถว</button>
        <button type="button" data-rows="2" class="rowCountBtn">2 แถว</button>
        <button type="button" data-rows="3" class="rowCountBtn">3 แถว</button>
      </div>
      <div class="small">ทุกแถวถือเป็นข้อมูลชุดเดียวกัน</div>
    </div>

    <div class="simplePalette">
      <div class="simplePaletteTitle">เลือกข้อมูลที่จะใช้</div>
      <div id="paletteItems" class="simplePaletteItems">
        <button type="button" data-type="BILL_DATE">วันที่</button>
        <button type="button" data-type="BILL_TIME">เวลา</button>
        <button type="button" data-type="STORE_ID">รหัสร้าน</button>
        <button type="button" data-type="POS_NUMBER">หมายเลข POS</button>
        <button type="button" data-type="COMPOSITE_CODE">รหัสประกอบ</button>
        <button type="button" data-type="CUSTOMER_VALUE">ยอด/เลขลูกค้า</button>
        <button type="button" data-type="LITERAL">ข้อความจำเพาะ</button>
        <button type="button" data-type="IGNORE">ข้อมูลที่ข้ามได้</button>
      </div>
      <div class="small">แตะกล่องเพื่อเพิ่มลงแถวที่เลือก แล้วลากสลับตำแหน่งได้</div>
    </div>

    <div id="rowsArea" class="simpleRowsArea"></div>

    <section id="fieldSettings" class="fieldSettingsSimple hidden">
      <div class="fieldSettingsHead">
        <strong id="fieldTitle">รายละเอียดข้อมูล</strong>
        <button id="removeFieldBtn" class="ghost dangerBtn">ลบกล่อง</button>
      </div>

      <div class="simpleFormGrid two">
        <label>ตัวอย่าง
          <input id="fieldExample" placeholder="เช่น 1705">
        </label>
        <label>ลักษณะข้อมูล
          <select id="fieldFormat">
            <option value="DATE">วันที่</option>
            <option value="TIME">เวลา</option>
            <option value="DIGITS">ตัวเลข</option>
            <option value="ALNUM">ตัวอักษรและตัวเลข</option>
            <option value="TEXT">ข้อความ</option>
            <option value="ANY">ไม่จำกัด</option>
          </select>
        </label>
        <label>จำนวนอย่างน้อย
          <input id="fieldMinLength" type="number" min="0" value="1">
        </label>
        <label>จำนวนไม่เกิน
          <input id="fieldMaxLength" type="number" min="1" value="12">
        </label>
      </div>

      <label class="checkRow">
        <input id="fieldRequired" type="checkbox" checked>
        <span>ต้องพบข้อมูลนี้</span>
      </label>

      <div id="literalBox" class="hidden">
        <label>คำที่ต้องพบ
          <input id="fieldLiteral" placeholder="เช่น BNO:">
        </label>
      </div>

      <div id="compositeBox" class="hidden">
        <div class="subSectionTitle">แบ่งรหัสประกอบ</div>
        <div class="simpleFormGrid two">
          <label>คำขึ้นต้น
            <input id="compositePrefix" placeholder="เช่น BNO:">
          </label>
          <label>ตัวคั่น
            <input id="compositeSeparator" placeholder="เช่น -">
          </label>
        </div>
        <div id="segmentRows" class="segmentRows"></div>
        <button id="addSegmentBtn" class="secondary full">เพิ่มส่วนของรหัส</button>
      </div>
    </section>

    <section class="simpleCheckPanel">
      <h4>ตรวจสอบก่อนรับข้อมูล</h4>
      <label class="checkRow"><input id="mustMatchStore" type="checkbox" checked><span>รหัสร้านต้องตรงกับร้านในแผนงาน</span></label>
      <label class="checkRow"><input id="mustMatchPos" type="checkbox" checked><span>หมายเลข POS ต้องตรงกับเครื่องของร้าน</span></label>
      <label class="checkRow"><input id="noDuplicatePos" type="checkbox" checked><span>ห้ามใช้ POS ซ้ำในงานเดียวกัน</span></label>
      <label class="checkRow"><input id="mustHaveDate" type="checkbox" checked><span>ต้องอ่านวันที่ได้</span></label>
      <label class="checkRow"><input id="mustHaveTime" type="checkbox" checked><span>ต้องอ่านเวลาได้</span></label>
      <label class="checkRow"><input id="mustHaveCustomer" type="checkbox" checked><span>ต้องอ่านยอด/เลขลูกค้าได้</span></label>
      <label>รอบยอด/เลขลูกค้า
        <select id="counterCycle">
          <option value="CONTINUOUS">นับต่อเนื่อง</option>
          <option value="MONTHLY">เริ่มใหม่ทุกเดือน</option>
          <option value="DAILY">เริ่มใหม่ทุกวัน</option>
          <option value="YEARLY">เริ่มใหม่ทุกปี</option>
        </select>
      </label>
    </section>
  </section>
</div>

<script src="config.js"></script>
<script src="admin-auth.js"></script>
<script src="content-page.js"></script>
<script src="ocr-simple.js"></script>
</body>
</html>
