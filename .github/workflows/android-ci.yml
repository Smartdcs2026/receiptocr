name: ReceiptOCR CI

on:
  push:
    branches:
      - round75-store-date-validation
      - round76-ocr-correction-store-identity
      - round77-workplan-store-normalization
      - round78-ocr-robustness-multi-image-admin-ux
      - round90-unified-date-admin-receipt-line
      - round91-confidence-regression-guard
      - round92-date-runtime-user-ui
      - round93-admin-date-variants-ui-duplicate-fix
    paths:
      - 'android-app/**'
      - 'web-admin/**'
      - 'tests/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - 'web-admin/**'
      - 'tests/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Work-plan store normalization tests
        run: node tests/workplan-store-normalizer.test.js

      - name: Admin OCR pattern tests
        run: node tests/ocr-pattern-engine.test.js

      - name: Admin OCR syntax
        run: |
          node --check web-admin/ocr-admin-ux.js
          node --check web-admin/ocr-pattern-engine.js
          node --check web-admin/ocr-simple.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace
