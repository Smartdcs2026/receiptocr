name: Round88 Apply Pipeline Parity Fix

on:
  push:
    branches:
      - round88-pipeline-parity-fix
    paths:
      - 'tools/round88_apply.py'
      - '.github/workflows/round88-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: round88-pipeline-parity-fix
          fetch-depth: 0

      - name: Apply Round88 integration
        run: python tools/round88_apply.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Admin OCR tests
        run: node tests/ocr-pattern-engine.test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app web-admin tests
          git diff --cached --quiet && exit 0
          git commit -m "Round88 pipeline parity and Thai year fix"
          git push origin HEAD:round88-pipeline-parity-fix
