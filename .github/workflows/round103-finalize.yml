name: Round103 photo evidence and admin review regression

on:
  push:
    branches: ["round103-photo-evidence-integrity-offline"]
    paths:
      - "android-app/**"
      - "web-admin/review.html"
      - "web-admin/review.js"
      - "web-admin/review-logic.js"
      - "web-admin/review-round103.css"
      - "web-admin/review-round103-fix.css"
      - "web-admin/review-evidence-round103.js"
      - "tests/review-logic.test.js"
      - "tools/round103_apply.py"
      - "tools/round103_worker_evidence_patch.py"
      - "cloudflare/migrations/round103_submission_evidence.sql"
      - ".github/workflows/round103-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Round103
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Round102 baseline
        run: git merge-base --is-ancestor 0570fca91a3ebef388e564f491138d6f83a7cbcd HEAD

      - name: Apply Round103 evidence patch
        run: python tools/round103_apply.py

      - name: Verify Round103 version and local evidence safeguards
        run: |
          grep -q 'versionCode = 105' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.103.0"' android-app/app/build.gradle.kts
          grep -q 'source = "CAMERA"' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'source = "GALLERY"' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'PhotoEvidenceManifest.missingSelected' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'มีภาพที่เปิดไม่ได้ กรุณาเลือกภาพใหม่' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'PhotoEvidenceManifest.reconcile' android-app/app/src/main/java/com/receiptocr/app/data/DemoRepository.kt
          grep -q 'archiveUri' android-app/app/src/main/java/com/receiptocr/app/util/PhotoEvidenceManifest.kt

      - name: Verify Round103 cloud evidence path
        run: |
          grep -q 'api/app/submissions/.*/evidence' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'receiptPaths: List<String?>' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'syncEvidenceForLatestSubmission' android-app/app/src/main/java/com/receiptocr/app/data/remote/SubmissionRepository.kt
          grep -q 'SubmissionRepository.syncEvidenceForLatestSubmission' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'field_submission_evidence' cloudflare/migrations/round103_submission_evidence.sql
          python -m py_compile tools/round103_worker_evidence_patch.py

      - name: Protect Round102 camera recovery and OCR baseline
        run: |
          grep -q 'PhotoCaptureRecovery.load' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'AppUiSession.restoreScreen' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          git diff --exit-code 0570fca91a3ebef388e564f491138d6f83a7cbcd -- android-app/app/src/main/java/com/receiptocr/app/ocr

      - name: Verify Round103 admin review workspace
        run: |
          node tests/review-logic.test.js
          node --check web-admin/review-logic.js
          node --check web-admin/review.js
          node --check web-admin/review-evidence-round103.js
          grep -q 'id="reviewEmployee"' web-admin/review.html
          grep -q 'id="reviewNotify"' web-admin/review.html
          grep -q 'review-evidence-round103.js' web-admin/review.html
          grep -q 'review-round103-fix.css' web-admin/review.html
          grep -q 'const POLL_MS=15000' web-admin/review.js
          grep -q 'newSubmissionIds' web-admin/review.js
          grep -q 'prefetchNext' web-admin/review.js
          grep -q 'employeeOptions' web-admin/review-logic.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Round103 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptOCR-Round103-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Commit verified Round103 generated source
        run: |
          if ! git diff --quiet; then
            git config user.name 'SKDC_SMART'
            git config user.email 'somchaibutphon@gmail.com'
            git add android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
            git add android-app/app/src/main/java/com/receiptocr/app/data/DemoRepository.kt
            git commit -m 'Round103 apply verified cloud evidence integration'
            git push
          else
            echo 'No generated source changes to commit'
          fi
