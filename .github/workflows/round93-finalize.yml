name: Round93 finalize production

on:
  push:
    branches:
      - round93-admin-date-variants-ui-duplicate-fix
    paths:
      - 'tools/round93_apply.py'
      - '.github/workflows/round93-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Round93
        uses: actions/checkout@v4
        with:
          ref: round93-admin-date-variants-ui-duplicate-fix
          fetch-depth: 0

      - name: Apply Round93 production source
        run: python tools/round93_apply.py

      - name: Normalize generated source EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('android-app/app/src/main/java/com/receiptocr/app/ui/UserFacingOcrMessages.kt')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Work Plan tests
        run: node tests/workplan-store-normalizer.test.js

      - name: Admin OCR pattern tests
        run: node tests/ocr-pattern-engine.test.js

      - name: Admin JavaScript syntax
        run: |
          node --check web-admin/ocr-admin-ux.js
          node --check web-admin/ocr-pattern-engine.js
          node --check web-admin/ocr-simple.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests including Round93 guards
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit verified production source
        run: |
          git config user.name "SKDC_SMART"
          git config user.email "somchaibutphon@gmail.com"
          git add android-app web-admin tests
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Round93 finalize Admin date variants and user review"
            git push origin HEAD:round93-admin-date-variants-ui-duplicate-fix
          fi
