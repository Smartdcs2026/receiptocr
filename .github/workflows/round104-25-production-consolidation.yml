name: Round104.25 production consolidation

on:
  push:
    branches: ["round10425-production-consolidation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Round104.25 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate consolidation patch syntax
        run: python -m py_compile tools/round104_25_production_consolidation_patch.py

      - name: Apply Round104.25 consolidation patch
        run: python tools/round104_25_production_consolidation_patch.py

      - name: Verify consolidated production guards
        run: |
          grep -q 'versionCode = 117' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.104.25"' android-app/app/build.gradle.kts
          grep -q 'message = "ส่งข้อมูลแล้ว"' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          ! grep -q 'ล็อกการแก้ไขจนกว่าผู้ตรวจจะส่งกลับ' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          ! grep -q 'ดูข้อมูลได้ แต่แก้ไขหรือลบไม่ได้' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'POS("POS")' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'RECEIPTS("รูปบิล")' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'NOTES("หมายเหตุ")' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          ! grep -q 'STORE_PHOTOS("ภาพร้าน")' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'SubmissionEditPolicy.isLocked' android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt
          grep -q 'versionCode = 117' tests/round10417-pos-terminal.test.js
          grep -q 'versionName = "0.104.25"' tests/round10417-pos-terminal.test.js
          grep -q 'Verify Round104.25 Android version' .github/workflows/round104-finalize.yml
          grep -q 'ReceiptOCR-Round104-25-debug' .github/workflows/round104-finalize.yml
          grep -q 'UniversalTemplateInterpreter' .github/workflows/round104-finalize.yml

      - name: Node and Admin regression checks
        run: |
          node tests/workplan-store-normalizer.test.js
          node tests/ocr-pattern-engine.test.js
          node tests/round10417-pos-terminal.test.js
          node tests/round10420-cj-terminal-fallback.test.js
          node --check web-admin/ocr-simple.js
          node --check web-admin/receipt-date-rules.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Round104.25 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptOCR-Round104-25-debug-premerge
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Commit tested Round104.25 source
        run: |
          git config user.name "receiptocr-actions"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tools/round104_25_production_consolidation_patch.py \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/java/com/receiptocr/app/ui/ReceiptOCRApp.kt \
            tests/round10417-pos-terminal.test.js \
            .github/workflows/round104-finalize.yml
          if git diff --cached --quiet; then
            echo "Round104.25 source already committed"
            exit 0
          fi
          git commit -m "Round104.25 consolidate field workflow for production"
          git push origin HEAD:round10425-production-consolidation
