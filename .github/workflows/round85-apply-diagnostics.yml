name: Round85 Apply OCR Diagnostics

on:
  push:
    branches:
      - round85-ocr-diagnostics
    paths:
      - 'tools/round85_diagnostics_patch.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: round85-ocr-diagnostics
          fetch-depth: 0

      - name: Apply Round85 diagnostics patch
        run: python tools/round85_diagnostics_patch.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app
          git diff --cached --quiet && exit 0
          git commit -m "Round85 expose real OCR read diagnostics"
          git push origin HEAD:round85-ocr-diagnostics
