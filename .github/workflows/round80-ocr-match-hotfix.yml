name: Round80.1 improve real bill text matching

on:
  push:
    branches:
      - round80-admin-apk-rule-alignment

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 tools/round80_1_hotfix.py
      - name: Run Android tests and build
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app
          if ! git diff --cached --quiet; then
            git commit -m "Round80.1 tolerate real bill spacing and digit lookalikes [skip ci]"
            git push origin HEAD:round80-admin-apk-rule-alignment
          fi
