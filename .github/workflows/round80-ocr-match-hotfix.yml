name: Round80.1 improve real bill text matching

on:
  push:
    branches: [round80-admin-apk-rule-alignment]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve matching from real bill images
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          gradle='android-app/app/build.gradle.kts'
          p=Path(gradle); s=p.read_text()
          s=s.replace('versionCode = 80\n        versionName = "0.80.0"','versionCode = 81\n        versionName = "0.80.1"')
          p.write_text(s)

          normalizer='android-app/app/src/main/java/com/receiptocr/app/ocr/OcrTextNormalizer.kt'
          replace_once(normalizer,
              'return normalized.replace(Regex("\\\\s*([:/.-])\\\\s*"), "${\'$\'}1")',
              'return normalized.replace(Regex("\\\\s*([:/\\\\.#-])\\\\s*"), "${\'$\'}1")')

          interp='android-app/app/src/main/java/com/receiptocr/app/ocr/UniversalTemplateInterpreter.kt'
          replace_once(interp,
'''    private fun literalPattern(raw: String): String? {
        val value = raw.trim()
        if (value.isBlank()) return null
        return when {
            value.matches(Regex("BNO\\\\s*:\\\\s*S", RegexOption.IGNORE_CASE)) -> "[B8]N[O0]\\\\s*[:;]\\\\s*[S$5]"
            value.matches(Regex("BNO\\\\s*:", RegexOption.IGNORE_CASE)) -> "[B8]N[O0]\\\\s*[:;]"
            else -> Regex.escape(value).replace("\\\\ ", "\\\\s+")
        }
    }''',
'''    private fun literalPattern(raw: String): String? {
        val value = raw.trim()
        if (value.isBlank()) return null
        return when {
            value.matches(Regex("BNO\\\\s*:\\\\s*S", RegexOption.IGNORE_CASE)) -> "[B8]N[O0]\\\\s*[:;]\\\\s*[S$5]"
            value.matches(Regex("BNO\\\\s*:", RegexOption.IGNORE_CASE)) -> "[B8]N[O0]\\\\s*[:;]"
            else -> value.map { character ->
                when (character) {
                    '0' -> "[0Oo]"
                    '1' -> "[1Iil|]"
                    else -> Regex.escape(character.toString())
                }
            }.joinToString("\\\\s*")
        }
    }''')

          replace_once(interp,
'''        fun collect(source: List<String>, joinPenalty: Int) {
            val joined = normalizeLine(source.joinToString(" "))
            row.regex.findAll(joined).forEach { match ->
                val fields = extractFields(row, match)
                val score = score(template, fields, work, workDate) - joinPenalty
                if (score > 0) found += TemplateMatch(template, fields, score, source)
            }
        }''',
'''        fun collect(source: List<String>, joinPenalty: Int) {
            val joined = normalizeLine(source.joinToString(" "))
            val compact = joined.replace(
                Regex("(?<=[A-Za-z0-9OoIl|])\\\\s+(?=[A-Za-z0-9OoIl|])"),
                ""
            )
            listOf(joined, compact).distinct().forEach { candidateText ->
                row.regex.findAll(candidateText).forEach { match ->
                    val fields = extractFields(row, match)
                    val score = score(template, fields, work, workDate) - joinPenalty
                    if (score > 0) found += TemplateMatch(template, fields, score, source)
                }
            }
        }''')
          PY
      - name: Run Android tests and build
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app .github/workflows/round80-ocr-match-hotfix.yml
          if ! git diff --cached --quiet; then
            git commit -m "Round80.1 tolerate real OCR spacing and digit lookalikes [skip ci]"
            git push origin HEAD:round80-admin-apk-rule-alignment
          fi
