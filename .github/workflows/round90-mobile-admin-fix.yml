name: Round90 mobile and Admin completion

on:
  push:
    branches: ["round90-unified-date-admin-receipt-line"]
    paths:
      - ".github/workflows/round90-mobile-admin-fix.yml"

permissions:
  contents: write

jobs:
  diagnose-noisy-mb02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round90-unified-date-admin-receipt-line
          fetch-depth: 0

      - name: Apply proposed Round90 patch in workspace only
        run: python3 tools/round90_mobile_admin_fix.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Persist exact noisy Mb_02 fusion result
        working-directory: android-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/test/java/com/receiptocr/app/ocr/PosEvidenceFusionRound90Test.kt')
          s=p.read_text()
          fn='    fun resolvesMb02WhenAllPassesHaveLiteralOrDateOcrNoise() {'
          start=s.find(fn)
          if start < 0:
              raise SystemExit('target noisy Mb_02 test not found after patch')
          needle='        assertTrue(result.containsKey(2))\n'
          pos=s.find(needle,start)
          if pos < 0:
              raise SystemExit('target noisy Mb_02 assertion not found')
          injected='        java.io.File("round90_diag_result.txt").writeText("ROUND90_NOISY_RESULT=" + result.toString())\n'
          s=s[:pos]+injected+s[pos:]
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.receiptocr.app.ocr.PosEvidenceFusionRound90Test.resolvesMb02WhenAllPassesHaveLiteralOrDateOcrNoise' --stacktrace || true
          test -f round90_diag_result.txt || echo 'ROUND90_NOISY_RESULT_FILE_NOT_CREATED' > round90_diag_result.txt
          cp round90_diag_result.txt ../round90_diag_result.txt

      - name: Commit diagnostic result only
        run: |
          git config user.name "SKDC_SMART"
          git config user.email "somchaibutphon@gmail.com"
          git add round90_diag_result.txt
          git commit -m "Round90 capture exact noisy Mb_02 fusion diagnostic" || true
          git push origin HEAD:round90-unified-date-admin-receipt-line
