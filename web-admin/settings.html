<section class="panel noteSettingsPage">

    <div><h2>รายการหมายเหตุ</h2><div class="small">กำหนดตัวเลือกที่ผู้ใช้งานจะเห็นในแอป แยกตามจุดใช้งาน</div></div>

</section>
