<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์ตรวจสอบงาน</title><link rel="stylesheet" href="styles.css?v=67"><link rel="stylesheet" href="review-editor-round104.css?v=104161"><link rel="stylesheet" href="review-evidence-direct-round104.css?v=104161"><link rel="stylesheet" href="review-workspace-v2.css?v=104161"><link rel="stylesheet" href="review-fast-round10428.css?v=104280"><link rel="stylesheet" href="review-editor-clarity-round10429.css?v=104290"><link rel="stylesheet" href="review-concept-round10430.css?v=104300"><link rel="stylesheet" href="review-brand-clarity-round10431.css?v=104310"><link rel="stylesheet" href="review-customer-trend-round10432.css?v=104321"><link rel="stylesheet" href="review-admin-only-round10433.css?v=104330"><link rel="stylesheet" href="review-customer-rank-round10434.css?v=104340"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body>
<div class="reviewPage reviewWorkspaceV2" data-review-round="104161">
  <section class="pageCommandBar reviewCommandBar">
    <div class="commandFilters reviewFilters">
      <label>สถานะ<select id="reviewStatus"><option value="SUBMITTED">รอตรวจ</option><option value="RETURNED">ส่งกลับแก้ไข</option><option value="APPROVED">ผ่านการตรวจ</option><option value="">ทั้งหมด</option></select></label>
      <label>พนักงาน<select id="reviewEmployee"><option value="">พนักงานทุกคน</option></select></label>
      <label>เรียงคิว<select id="reviewSort"><option value="oldest">ส่งก่อน ตรวจ ก่อน</option><option value="newest">งานล่าสุดก่อน</option></select></label>
      <label class="reviewSearchLabel">ค้นหา<input id="reviewSearch" type="search" placeholder="รหัส / ร้าน / คนส่ง"></label>
      <button id="refreshReview" class="secondary">รีเฟรช</button>
      <button id="reviewNotify" class="secondary reviewNotifyButton" aria-pressed="false">แจ้งเตือน: ปิด</button>
    </div>
    <div class="reviewLiveMeta"><span class="reviewLiveDot"></span><span>อัปเดตอัตโนมัติทุก 15 วินาที</span><span id="reviewLastUpdated">-</span></div>
  </section>

  <section class="reviewMetrics" aria-label="สรุปคิวตรวจ">
    <div class="reviewMetric"><span>รอตรวจทั้งหมด</span><strong id="reviewPendingCount">0</strong></div>
    <div class="reviewMetric"><span>พนักงานที่มีงานรอ</span><strong id="reviewPendingPeople">0</strong></div>
    <div class="reviewMetric reviewMetricNew"><span>งานใหม่พร้อมตรวจ</span><strong id="reviewNewCount">0</strong></div>
    <div class="reviewMetric"><span>รอนานที่สุด</span><strong id="reviewOldestWait">-</strong></div>
  </section>

  <div id="reviewPeople" class="reviewPeople" aria-label="เลือกตรวจรายบุคคล"></div>

  <div class="reviewWorkspace" id="reviewWorkspace">
    <aside class="reviewQueuePanel" id="reviewQueuePanel">
      <header><div><strong>คิวตรวจงาน</strong><span id="reviewQueueCaption">งานใหม่เข้าคิวอัตโนมัติ · เลือกร้านเพื่อตรวจ</span></div><div class="reviewCountBox"><strong id="reviewCount">0</strong><span>รายการ</span></div></header>
      <div id="reviewQueue" class="reviewQueue"><div class="officeEmpty">กำลังโหลดข้อมูล</div></div>
    </aside>
    <main class="reviewDetailPanel" id="reviewDetail">
      <div class="reviewWelcome"><strong>เลือกงานจากคิวด้านซ้าย</strong><span>ระบบจะแสดงภาพบิล ภาพร้าน และข้อมูล POS ของร้านที่เลือก</span></div>
    </main>
  </div>
</div>
<script src="config.js"></script><script src="admin-auth.js?v=104161"></script><script src="content-page.js?v=104161"></script><script src="review-logic.js?v=104161"></script><script src="review-evidence-round103.js?v=104161"></script><script src="review-runtime-round104.js?v=104161"></script><script src="review-editor-round104.js?v=104161"></script><script src="review-storage-sync-round104.js?v=104161"></script><script src="review-evidence-direct-round104.js?v=104161"></script><script src="review-auto-images-round104.js?v=104161"></script><script src="review.js?v=104161"></script><script src="review-workspace-v2.js?v=104161"></script><script src="review-fast-round10428.js?v=104280"></script><script src="review-concept-round10430.js?v=104300"></script><script src="review-brand-clarity-round10431.js?v=104310"></script><script src="review-customer-trend-model-round10432.js?v=104321"></script><script src="review-customer-rank-round10434.js?v=104340"></script><script src="review-customer-trend-round10432.js?v=104330"></script><script src="review-customer-rank-ui-round10434.js?v=104340"></script></body></html>
