<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ผู้ใช้และสิทธิ์ | ReceiptOCR</title>
  <link rel="stylesheet" href="styles.css?v=63">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="simplePage">
  <section class="simpleHero">
    <div>
      <h2>ผู้ใช้และสิทธิ์</h2>
      <p>จัดการผู้ปฏิบัติงานภาคสนาม หัวหน้างาน หัวหน้าฝ่าย และผู้ดูแลระบบ</p>
    </div>
    <div class="userHeroActions"><button id="recoveryCodesBtn" class="secondary">รหัสกู้คืนของฉัน</button><button id="addUserBtn" class="primary">+ เพิ่มบัญชี</button></div>
  </section>

  <section class="simplePanel">
    <div class="userTypeTabs"><button class="active" data-view="FIELD">ผู้ปฏิบัติงานภาคสนาม</button><button data-view="OFFICE">ผู้ใช้สำนักงาน</button></div>
    <div class="simpleToolbar">
      <input id="userSearch" placeholder="ค้นหารหัส ชื่อ หรือชื่อเข้าระบบ">
      <div id="userCount" class="small">0 คน</div>
    </div>
    <div id="userList" class="userCardList"></div>
  </section>
</div>

<script src="config.js"></script>
<script src="admin-auth.js?v=63"></script>
<script src="content-page.js"></script>
<script src="users.js?v=63"></script>
</body>
</html>
