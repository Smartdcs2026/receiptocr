name: Round90 noisy Mb02 diagnostic

on:
  push:
    branches: ["round90-unified-date-admin-receipt-line"]
    paths:
      - ".github/workflows/round90-mobile-admin-fix.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round90-unified-date-admin-receipt-line
      - name: Prepare exact production patch plus diagnostic
        run: python3 tools/round90_fusion_diagnostic.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run exact noisy Mb_02 test and show collected evidence
        working-directory: android-app
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest --tests 'com.receiptocr.app.ocr.PosEvidenceFusionRound90Test.resolvesMb02WhenAllPassesHaveLiteralOrDateOcrNoise' --stacktrace
          rc=$?
          echo '----- ROUND90 FUSION DEBUG -----'
          cat /tmp/round90_fusion_debug.txt || true
          echo '----- END DEBUG -----'
          exit $rc
